# =============================================================================
# coforma-studio-secrets — TEMPLATE (DO NOT APPLY)
# =============================================================================
# This file is intentionally NOT in `kustomization.yaml resources:`. It
# documents every key the running pods expect to find in the K8s Secret
# named `coforma-studio-secrets` (mounted as `envFrom` with `optional: true`
# on the web/api deployments). Placeholder values only — never commit real
# secrets, per AGENTS.md.
#
# Operator workflow (one-time per environment):
#   1. Create a non-tracked env file from the stringData keys below.
#   2. Replace every placeholder with the real value.
#   3. Provision through Enclii (not raw kubectl), e.g.:
#      enclii onboard --repo madfam-org/coforma-studio --project coforma-studio \
#        --manifest-path infra/k8s/production --secret-name coforma-studio-secrets \
#        --secrets-file <your-real-coforma.env>
#
# Scope notes (2026-07-07, see docs/deploy-readiness.md):
#   - Only the `web` deployment is currently in kustomization resources.
#     The built web artifact serves the root `app/` shell (landing page +
#     /api/health); the product routes under `src/app/` are NOT in the
#     artifact, so most keys below are forward-looking until that is fixed.
#   - The `api` package does not compile yet; API keys below document what
#     its code reads (`ConfigService.get(...)` / `process.env`) for when it
#     is onboarded.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: coforma-studio-secrets
  namespace: coforma-studio
type: Opaque
stringData:
  # ──── Shared ────
  NODE_ENV: production
  LOG_LEVEL: info

  # ──── Database / cache (needed by api; web `src/app` routes also use
  #      Prisma directly today) ────
  DATABASE_URL: postgresql://coforma:__DB_PASSWORD__@__DB_HOST__:5432/coforma
  REDIS_URL: redis://__REDIS_HOST__:6379

  # ──── Web (Next.js) — Janua OIDC auth (packages/web/src/lib/auth.ts) ────
  JANUA_ISSUER_URL: https://auth.madfam.io
  JANUA_CLIENT_ID: __JANUA_CLIENT_ID__
  JANUA_CLIENT_SECRET: __JANUA_CLIENT_SECRET__
  # Coforma's own HS256 key for the `janua_session` cookie (not a Janua
  # secret; Janua never sees it). Required: when unset, no session is minted or
  # trusted. Use at least 32 bytes, e.g. `openssl rand -hex 32`.
  JANUA_JWT_SECRET: __JANUA_JWT_SECRET__
  NEXT_PUBLIC_JANUA_ISSUER_URL: https://auth.madfam.io
  NEXT_PUBLIC_JANUA_CLIENT_ID: __JANUA_CLIENT_ID__
  NEXT_PUBLIC_APP_URL: https://coforma.studio
  NEXT_PUBLIC_API_URL: https://api.coforma.studio
  # Deprecated NextAuth redirect stub still reads this:
  NEXTAUTH_URL: https://coforma.studio

  # ──── PhyndCRM relay (web src/app webhook route + api integration) ────
  PHYNDCRM_INBOUND_SECRET: __PHYNDCRM_INBOUND_SECRET__
  PHYNDCRM_OUTBOUND_SECRET: __PHYNDCRM_OUTBOUND_SECRET__
  PHYNDCRM_OUTBOUND_URL: https://phyndcrm-api.madfam.io
  PHYNDCRM_OUTBOUND_TIMEOUT_MS: "5000"

  # ──── API (NestJS) — blocked on api build; documented for onboarding ────
  PORT: "3001"
  CORS_ALLOWED_ORIGINS: https://coforma.studio
  SENTRY_DSN: __SENTRY_DSN__
  JANUA_API_URL: https://auth.madfam.io
  JANUA_API_KEY: __JANUA_API_KEY__

  # ──── Tulana PMF webhook (ADR-003; ships inside the api package) ────
  # Must match Tulana's COFORMA_WEBHOOK_SECRET (tulana-secrets K8s Secret).
  # Target endpoint: POST ${TULANA_API_URL}/v1/pmf/coforma-event
  TULANA_API_URL: https://tulana-api.madfam.io
  TULANA_PMF_WEBHOOK_SECRET: __MUST_MATCH_TULANA_COFORMA_WEBHOOK_SECRET__
